<!doctype html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="assets/js/gate.js"></script>
<title>Contact — Katha Studios</title>
<meta name="description" content="Get in touch with Katha Studios about projects, partnerships, distribution, syndication, creative solutions, talent and press.">
<meta name="theme-color" content="#F3EEE4">
<meta property="og:type" content="website">
<meta property="og:title" content="Contact — Katha Studios">
<meta property="og:description" content="Get in touch with Katha Studios about projects, partnerships, distribution, syndication, creative solutions, talent and press.">
<link rel="icon" type="image/png" href="assets/brand/katha-logo-192.png">
<script>document.documentElement.className+=' js';try{var v=sessionStorage.getItem('k-veil');if(v){document.documentElement.className+=' veil-on';document.documentElement.style.setProperty('--veil',v)}}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://images.unsplash.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=Schibsted+Grotesk:wght@400..700&display=swap">
<link rel="stylesheet" href="assets/css/katha.css">
</head>
<body data-page="contact" data-nav="contact">

<main id="main">
  <section class="section s-ivory contact" aria-labelledby="contact-title">
    <div class="container">
      <nav class="page-head__crumb" aria-label="Breadcrumb"><span class="marker" aria-hidden="true"></span><span class="meta">Contact</span></nav>
      <div class="grid" style="align-items:start">
        <h1 class="t-display contact__title" id="contact-title" data-reveal="lines"><span class="mask"><span>Where does</span></span><span class="mask"><span><em>your idea</em></span></span><span class="mask"><span>go next?</span></span></h1>
        <div class="contact__aside" data-reveal="up">
          <p class="t-lede">For projects, partnerships, distribution, syndication, creative solutions, talent and press — start here.</p>
          <div data-contact-lines></div>
        </div>
        <form class="contact__form" data-form novalidate data-reveal="up" style="--d:.1s">
          <div class="field"><label for="f-name">Your name</label><input id="f-name" name="name" type="text" autocomplete="name" required></div>
          <div class="field"><label for="f-email">Email</label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
          <div class="field"><label for="f-org">Organisation <span style="text-transform:none;letter-spacing:0;font-weight:400">(optional)</span></label><input id="f-org" name="organisation" type="text" autocomplete="organization"></div>
          <fieldset class="topics"><legend>What is it about?</legend><div class="topics__list" data-topics></div></fieldset>
          <div class="field"><label for="f-msg">Message</label><textarea id="f-msg" name="message" rows="4" required></textarea></div>
          <div class="form__foot">
            <p class="form__status" data-status role="status" aria-live="polite"></p>
            <button type="submit" class="btn-send">Send <span class="arrow" aria-hidden="true"></span></button>
          </div>
        </form>
      </div>
    </div>
  </section>
</main>

<noscript><p style="padding:24px;font-family:sans-serif">This site uses JavaScript to show its full content.</p></noscript>

<script src="assets/js/content.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/motion.js"></script>
<script src="assets/js/pages.js"></script>
<script src="assets/js/site.js"></script>
</body>
</html>
